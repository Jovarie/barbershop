{% extends "base.html" %}
{% block title %}{{ "Edit " ~ service.name if service else "Add a service" }}{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="panel">
        <h1>{{ "Edit " ~ service.name if service else "Add a service" }}</h1>
        <form method="post" class="mt-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label class="form-label fw-bold" for="name">Name</label>
          <input class="form-control mb-3" id="name" name="name" maxlength="100" required
                 value="{{ form.get('name', '') }}">
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label fw-bold" for="duration_min">Length (minutes)</label>
              <input class="form-control" type="number" id="duration_min" name="duration_min"
                     min="5" max="240" step="5" required value="{{ form.get('duration_min', '') }}">
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-bold" for="price">Price (£)</label>
              <input class="form-control" type="number" id="price" name="price"
                     min="0" max="1000" step="0.01" required value="{{ form.get('price', '') }}">
            </div>
          </div>
          <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" role="switch" id="active" name="active"
                   {{ "checked" if form.get("active") == "on" }}>
            <label class="form-check-label" for="active">Customers can book this</label>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-gold" type="submit">Save</button>
            <a class="btn btn-outline-dark rounded-pill" href="{{ url_for('admin.services') }}">Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
