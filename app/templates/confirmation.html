{% extends "base.html" %}
{% block title %}Booking confirmed{% endblock %}
{% block content %}
<h1>Booking confirmed</h1>
<p>{{ appointment.customer.name }}, you're booked for a <strong>{{ appointment.service.name }}</strong>
on {{ appointment.starts_at.strftime("%A %d %B at %H:%M") }}.</p>
<p><a href="{{ url_for('booking.services') }}">Book something else</a></p>
{% endblock %}
